<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare - Início</title>
<link rel="stylesheet" href="style.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="phone">

    <div class="header-row">
      <div class="header-left">
        <div class="avatar-sm"></div>
        <div>
          <p class="greeting">Good morning</p>
          <p class="username">Sarah Johnson</p>
        </div>
      </div>
      <button class="bell-btn">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="bell-dot"></span>
      </button>
    </div>

    <div class="search-bar">
      <ion-icon name="search-outline" style="color:#6B6873;"></ion-icon>
      <input type="text" placeholder="Search doctors..." />
      <button class="search-btn"><ion-icon name="search"></ion-icon></button>
    </div>

    <a href="appointment.html" class="upcoming-card">
      <p class="eyebrow">UPCOMING APPOINTMENT</p>
      <div class="upcoming-row">
        <div>
          <p class="upcoming-doctor">Dr. Emma<br>Wilson</p>
          <span class="time-chip">Tomorrow · 10:00 AM</span>
        </div>
        <div class="upcoming-avatar"><ion-icon name="person"></ion-icon></div>
      </div>
    </a>

    <div class="section-header">
      <h2 class="section-title">Specialties</h2>
      <a href="#" class="see-all">See All</a>
    </div>
    <div class="specialties-row">
      <div class="specialty-item">
        <div class="specialty-circle" style="background:#FBEAE6;">❤️</div>
        <span class="specialty-label">Cardiology</span>
      </div>
      <div class="specialty-item">
        <div class="specialty-circle" style="background:#F3ECFB;">🦷</div>
        <span class="specialty-label">Dental</span>
      </div>
      <div class="specialty-item">
        <div class="specialty-circle" style="background:#FBEAE6;">🧠</div>
        <span class="specialty-label">Neurology</span>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">Top Doctors</h2>
      <a href="#" class="see-all">See All</a>
    </div>

    <a href="appointment.html" class="doctor-card">
      <div class="doctor-avatar"><ion-icon name="person"></ion-icon></div>
      <div>
        <p class="doctor-name">Dr. Emma Wilson</p>
        <p class="doctor-place">City Heart Hospital</p>
        <div class="doctor-tags">
          <span class="tag tag-exp">12 yrs exp</span>
          <span class="tag tag-available">Available today</span>
        </div>
      </div>
    </a>

    <a href="appointment.html" class="doctor-card">
      <div class="doctor-avatar"><ion-icon name="person"></ion-icon></div>
      <div>
        <p class="doctor-name">Dr. Emma Wilson</p>
        <p class="doctor-place">City Heart Hospital</p>
        <div class="doctor-tags">
          <span class="tag tag-exp">12 yrs exp</span>
          <span class="tag tag-available">Available today</span>
        </div>
      </div>
    </a>

    <nav class="bottom-nav">
      <button class="nav-item active"><ion-icon name="home"></ion-icon></button>
      <button class="nav-item"><ion-icon name="search-outline"></ion-icon></button>
      <a href="appointment.html" class="nav-item"><ion-icon name="calendar-outline"></ion-icon></a>
      <button class="nav-item"><ion-icon name="person-outline"></ion-icon></button>
    </nav>

  </div>
</body>
</html>
